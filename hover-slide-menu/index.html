    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const menuBtn = document.querySelector(".menu");
            const content = document.querySelector(".menu-content");
            menuBtn.addEventListener("click", () => {
                content.classList.toggle("active");
                menuBtn.classList.toggle("active");
            })
        });

        document.addEventListener("DOMContentLoaded", function () {
            const menuItems = document.querySelectorAll(".menu-list-items");
            const hoverImages = document.querySelectorAll(".menu-hover-img");

            menuItems.forEach(item => {
                const hoverValue = item.getAttribute("hover-item");

                item.addEventListener("mouseenter", () => {
                    hoverImages.forEach(img => {
                        if (img.getAttribute("hover-img") === hoverValue) {
                            img.classList.add("active");
                        }
                    });
                });

                item.addEventListener("mouseleave", () => {
                    hoverImages.forEach(img => {
                        if (img.getAttribute("hover-img") === hoverValue) {
                            img.classList.remove("active");
                        }
                    });
                });
            });
        });

        document.addEventListener("DOMContentLoaded", function () {
            const menuList = document.querySelector(".menu-list");
            const hoverLeft = document.querySelector(".menu-hover-item-left");
            const hoverRight = document.querySelector(".menu-hover-item-right");

            menuList.addEventListener("mousemove", function (e) {
                const rect = menuList.getBoundingClientRect();
                const mouseY = e.clientY - rect.top;
                const height = rect.height;

                let pxValue = mouseY;

                pxValue = Math.max(0, Math.min(height, pxValue));

                hoverLeft.style.top = pxValue + "px";
                hoverRight.style.bottom = pxValue + "px";
            });
        });
    </script>
